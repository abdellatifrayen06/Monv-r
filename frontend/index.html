<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/monver-favicon.svg" />
    <link rel="apple-touch-icon" href="/monver-favicon.svg" />

    <!-- PWA / theme -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1C1815" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MONVÉR" />

    <!-- SEO -->
    <title>MONVÉR — Maroquinerie & accessoires en cuir</title>
    <meta name="description" content="MONVÉR — Maroquinerie en cuir pour femme et homme. Portefeuilles, ceintures, sacs, trousses de toilette et accessoires en cuir au design intemporel. Livraison partout en Tunisie, paiement à la livraison." />

    <!-- Open Graph -->
    <meta property="og:site_name" content="MONVÉR" />
    <meta property="og:title" content="MONVÉR — Maroquinerie & accessoires en cuir" />
    <meta property="og:description" content="Maroquinerie en cuir au design intemporel pour femme et homme. Portefeuilles, ceintures, sacs et accessoires pensés pour le quotidien." />
    <meta property="og:image" content="https://monver.com/og-monver.svg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://monver.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_TN" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MONVÉR — Maroquinerie & accessoires en cuir" />
    <meta name="twitter:description" content="Maroquinerie en cuir au design intemporel pour femme et homme. Livraison partout en Tunisie, paiement à la livraison." />
    <meta name="twitter:image" content="https://monver.com/og-monver.svg" />

    <!-- Critical CSS — avoids layout shift before Tailwind bundle loads -->
    <style>
      *,*::before,*::after{box-sizing:border-box}
      html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
      body{margin:0;font-family:"Jost",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#F7F3EC;color:#1C1815}
      #root{min-height:100dvh}
      .hero-slot{min-height:420px;background:#EFE9DF}
      @media(min-width:640px){.hero-slot{min-height:480px}}
      @media(min-width:768px){.hero-slot{min-height:560px}}
      @media(min-width:1024px){.hero-slot{min-height:620px}}
      .age-rail-slot{min-height:148px;background:#F7F3EC;border-bottom:1px solid #E7DFD2}
    </style>

    <!-- LCP hero image — home only -->
    <link rel="preload" as="image" href="/hero-main.png" fetchpriority="high" data-lcp-hero />
    <script>
      (function () {
        var path = location.pathname;
        if (path !== "/" && path !== "") return;
        try {
          var saved = sessionStorage.getItem("monver_lcp_hero");
          if (saved) {
            var link = document.querySelector('link[data-lcp-hero]');
            if (link) link.href = saved;
          }
        } catch (e) {}
      })();
    </script>

    <!-- DNS prefetch for API / CDN -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="dns-prefetch" href="https://connect.facebook.net" />

    <!-- Fonts — preconnect then load async to avoid render-blocking -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Jost:wght@300;400;500;600;700&family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Jost:wght@300;400;500;600;700&family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&display=swap" />
    </noscript>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Aller au contenu principal</a>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
